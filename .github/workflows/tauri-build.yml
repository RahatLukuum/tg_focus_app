name: Tauri build (Windows + macOS)

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

jobs:
    build-tauri:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact_name: tauri-macos-arm64
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact_name: tauri-windows-x64
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: frontend/src-tauri -> target

            - name: Install frontend deps
              working-directory: frontend
              run: npm ci

            - name: Build Tauri app
              working-directory: frontend
              run: npm run tauri:build

            - name: Upload macOS artifacts
              if: matrix.os == 'macos-latest'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: |
                      frontend/src-tauri/target/release/bundle/dmg/*.dmg
                      frontend/src-tauri/target/release/bundle/macos/*.app

            - name: Upload Windows artifacts
              if: matrix.os == 'windows-latest'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: |
                      frontend/src-tauri/target/release/bundle/msi/*.msi
                      frontend/src-tauri/target/release/bundle/nsis/*.exe
