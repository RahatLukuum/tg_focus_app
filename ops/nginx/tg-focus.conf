# HTTP → HTTPS редирект
server {
    listen 80;
    server_name 83-222-21-227.nip.io 83.222.21.227;

    # Let's Encrypt webroot challenge — оставляем доступным по HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://83-222-21-227.nip.io$request_uri;
    }
}

# HTTPS основной сервер
server {
    listen 443 ssl http2;
    server_name 83-222-21-227.nip.io;
    root /var/www/tg-focus;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/83-222-21-227.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/83-222-21-227.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set $is_html 0;
    if ($http_accept ~* "text/html") { set $is_html 1; }
    if ($http_x_requested_with = "XMLHttpRequest") { set $is_html 0; }

    location ~ ^/(auth|me|dialogs|tasks|folders|messages|send_message|queue|ws|healthz|media|contacts|bootstrap|send_media|resolve_contact|generate_reply|chat_info|topics|archived_dialogs) {
        if ($is_html = 1) { rewrite ^ /index.html last; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
