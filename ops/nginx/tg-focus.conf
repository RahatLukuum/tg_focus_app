server {
  listen 80;
  server_name 185.252.215.73;
  root /var/www/tg-focus;
  index index.html;

  # SPA: serve index.html for any path that doesn't map to a real file.
  # Browser refreshes (Accept: text/html) on /queue, /auth, /messages, /tasks
  # MUST land on index.html, not on the backend's collision-named API endpoints.
  # The map below distinguishes browser-html refreshes from XHR/fetch JSON calls.
  set $is_html 0;
  if ($http_accept ~* "text/html") {
    set $is_html 1;
  }
  if ($http_x_requested_with = "XMLHttpRequest") {
    set $is_html 0;
  }

  # API and asset endpoints — exact prefixes proxied to FastAPI on :8080.
  # /queue alone (browser refresh) falls through to / → SPA. /queue/action stays.
  # The same is true for any other route that the SPA happens to mount.
  location ~ ^/(auth|me|dialogs|tasks|folders|messages|send_message|queue|ws|healthz|media|contacts|bootstrap|send_media|resolve_contact|generate_reply|chat_info|topics|archived_dialogs) {
    if ($is_html = 1) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    client_max_body_size 100M;
  }

  # Default: try real file, then fall back to SPA index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
